# Pinned for golangci-lint v2 (see `make tools` / .github/workflows/ci.yml).
# Both Go modules (server, daemon) share this configuration.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose      # leaked response bodies exhaust the daemon's connections
    - errorlint
    - gosec          # this codebase drives a browser over untrusted pages
    - misspell
    - noctx          # every outbound call must be cancellable by a run cancel
    - revive
    - unconvert
  exclusions:
    rules:
      # Table-driven tests deliberately construct unsafe inputs.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
