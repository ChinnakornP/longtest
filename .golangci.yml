# Pinned for golangci-lint v2 (see `make tools` / .github/workflows/ci.yml).
# Both Go modules (server, daemon) share this configuration.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose      # leaked response bodies exhaust the daemon's connections
    - errorlint
    - gosec          # this codebase drives a browser over untrusted pages
    - misspell
    - noctx          # every outbound call must be cancellable by a run cancel
    - revive
    - unconvert
  exclusions:
    rules:
      # Table-driven tests deliberately construct unsafe inputs.
      - path: _test\.go
        linters:
          - gosec

      # The Landlock bindings are raw syscalls: the kernel takes struct
      # pointers by address and there is no wrapper in the standard library,
      # so G103 fires on every call. Suppressed for this file only, not for
      # gosec generally, and every buffer is a fixed size laid out immediately
      # above its use. This is the file that enforces "the AI CLI cannot read
      # outside its workspace" - see docs/SECURITY.md.
      - path: daemon/security/landlock_linux\.go
        text: "G103"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
