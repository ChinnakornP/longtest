name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: no job needs to write to the repository.
# A job that genuinely needs more raises it locally, never here.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Third-party actions are pinned to a commit SHA, not a tag: a tag can be
  # moved by whoever owns the action.
  GOLANGCI_LINT_VERSION: v2.13.2
  GITLEAKS_VERSION: v8.30.0
  NODE_VERSION: '24'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Cache Go modules and tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin
          key: go-lint-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-

      - name: Install golangci-lint
        # Built from source at a pinned version so the checksum database
        # verifies it. No curl-to-shell installers in this pipeline.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint Go
        # The Makefile falls back to $(go env GOPATH)/bin when golangci-lint
        # is not on PATH, which is where `go install` just put it.
        run: make lint-go

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint JS (eslint + tsc)
        run: make lint-js

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-test-${{ runner.os }}-

      - name: Test Go
        run: make test-go

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Test JS (vitest)
        run: make test-js

  security:
    name: security
    runs-on: ubuntu-latest
    # This job now does real work: the scans, the Go boundary suite (T12) and a
    # full production build of apps/web (T18). Measured on run 33936944291 the
    # scans alone were 11s; the added Go and Node work lands the whole job
    # around two minutes warm, and well under five on a cold toolchain cache.
    # 15 keeps a runaway build bounded without making a slow cache flaky, and
    # matches `lint` and `test`.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Secret scan
        # --redact keeps any hit out of the (public) CI log; the fingerprint in
        # the output is enough to locate it in a local run.
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" -w /repo \
            "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}" \
            dir --no-banner --redact --config /repo/.gitleaks.toml .

      - name: Validate docker-compose
        run: docker compose --env-file .env.example config --quiet

      - name: Reject a committed .env
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git - it must stay local (see .env.example)"
            exit 1
          fi
          echo "no .env is tracked"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-security-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-security-${{ runner.os }}-

      # These also run inside `test`, as part of `go test ./...`. They are
      # repeated here so that a boundary regression shows up as a red
      # `security` check rather than as one line inside a general test run: the
      # point of a named gate is that a reviewer can see which one failed
      # without opening the log.
      #
      # The sandbox tests need a kernel with Landlock (5.13+). ubuntu-latest
      # has it; if a future runner image does not, they skip loudly rather than
      # pass silently, and `Assert the sandbox was really exercised` below
      # turns that skip into a failure.
      - name: Prompt-injection corpus and security boundary
        run: |
          # pipefail is not on by default in an Actions `run` block, and
          # without it `go test | tee` reports tee's exit status: a failing
          # boundary test would land as a green check.
          set -euo pipefail
          cd daemon
          go test ./security/... ./agent/prompts/... -count=1 -v 2>&1 | tee ../security-test.log
          echo "--- summary ---"
          grep -cE '^\s*--- PASS' ../security-test.log

      - name: Assert the sandbox was really exercised
        # A skipped confinement test is indistinguishable from a passing one in
        # the exit code, and "the AI CLI cannot read outside its workspace" is
        # the claim in docs/SECURITY.md that most needs to be true.
        run: |
          set -euo pipefail
          if grep -qE '^\s*--- SKIP: TestSandboxConfines' security-test.log; then
            echo "::error::the filesystem confinement tests skipped - this runner has no usable Landlock"
            grep -E '^\s*--- SKIP' security-test.log
            exit 1
          fi
          for required in \
            TestSandboxConfinesReadsToTheWorkspace \
            TestSandboxConfinesWritesToTheWorkspace \
            TestCorpusCannotReachTheInstructionRegion \
            TestCorpusHijackedPlansAreRejected \
            TestNothingLeaksACredentialAcrossAWholeRun; do
            if ! grep -qE "^\s*--- PASS: $required" security-test.log; then
              echo "::error::$required did not pass - see docs/SECURITY.md"
              exit 1
            fi
          done
          echo "every named security gate passed"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Web production build ships no server routes
        # apps/web is a client of the Go backend, never a backend itself
        # (docs/adr/0008-web-ships-no-backend.md). The T05 mock
        # (route.mock.ts) is excluded by pageExtensions in a production
        # build; this asserts the build output, not the intent. The guard
        # outlives the mock: it must still pass once T05 is deleted.
        env:
          # Not a real endpoint and never fetched - the build only needs a
          # non-empty value, because resolveApiBase() throws when
          # NEXT_PUBLIC_API_BASE_URL is unset in a production build.
          NEXT_PUBLIC_API_BASE_URL: https://api.invalid
        run: |
          set -euo pipefail
          pnpm --filter @qa/web run build
          manifest=apps/web/.next/app-path-routes-manifest.json
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest is missing - the guard cannot read the build output, so it fails closed"
            exit 1
          fi
          if grep -q '"/api/' "$manifest"; then
            echo "::error::apps/web production build emitted API route handlers - apps/web must not ship a backend (docs/adr/0008-web-ships-no-backend.md)"
            grep -o '"/api[^"]*"' "$manifest"
            exit 1
          fi
          echo "no /api route handlers in the web production build"

  test-db:
    # Split out from `test` because it needs a Postgres service: `make test-go`
    # skips the schema, queue and tenancy tests when TEST_DATABASE_URL is unset,
    # so without this job CI stays green while the cross-tenant FK test, the
    # SKIP LOCKED test and the migration round-trip test never run.
    #
    # The suite CREATEs and DROPs its own scratch database on the service
    # container, so nothing needs migrating before it starts.
    name: test-db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: qa
          POSTGRES_USER: qa
          # Not a secret: this container is created and destroyed inside this
          # job, on this runner only. A repo secret here would buy nothing and
          # add masking noise to the log.
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-testdb-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-testdb-${{ runner.os }}-

      - name: Migration round trip, schema and queue tests
        env:
          # The suite CREATEs and DROPs its own scratch databases on this
          # server, so it needs the maintenance database, not a migrated one.
          TEST_DATABASE_URL: postgres://qa:ci-only-not-a-secret@127.0.0.1:5432/qa?sslmode=disable
        run: cd server && go test ./... -count=1

  e2e:
    # The browser-backed suite. Split out from `test` because it needs a real
    # Chromium: without one the executor integration tests and the planner
    # executability benchmark skip themselves, and CI stays green while the
    # only tests that drive a browser never run.
    #
    # What it protects: an AI-authored test plan can be a flawless test-plan@1
    # and still point at elements that are not on the page. The backend's ref
    # check makes that unstorable; only a real browser can confirm that the
    # application map it checks against still describes the application. This
    # job is where that number comes from, and it fails under 80% of the
    # golden plan's cases running with every target resolved.
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache the Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the pinned playwright version: a browser build belongs to
          # the library version that drives it.
          key: playwright-${{ runner.os }}-${{ hashFiles('daemon/executor/package.json') }}

      - name: Install Chromium
        # --with-deps every time: the cache restores the browser, not the
        # system libraries it links against, and those come from the runner
        # image rather than from the cache key.
        run: pnpm --filter @qa/executor exec playwright install --with-deps chromium

      - name: Executor integration and planner executability
        run: make test-e2e

  # One check to require in branch protection.
  #
  # Requiring each job by name means every new job has to be added to the
  # protection rule by hand, and a job that is silently missing from that list
  # is a gate that is not a gate. This one depends on all of them, so a new job
  # is covered the moment it is added to `needs`.
  #
  # Branch protection on `main` must require: `ci` (this job). Setting that is
  # a repository-settings change and cannot be done from a workflow file.
  ci:
    name: ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, security, test-db, e2e]
    steps:
      - name: Every gate passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($results)"
              exit 1
            fi
          done
