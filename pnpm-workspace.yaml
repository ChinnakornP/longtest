packages:
  - apps/*
  - packages/*
  - daemon/executor
  - e2e/fixture-app
  - e2e/injection-corpus

# Supply-chain guard: refuse to resolve a package version that was published
# less than 24h ago. Compromised-maintainer npm attacks are caught and yanked
# within hours, and nothing in this repo needs a same-day release.
# Add a reviewed `<name>@<version>` to minimumReleaseAgeExclude to override.
minimumReleaseAge: 1440

# esbuild ships a postinstall script that downloads its native binary. It is
# safe to run; we whitelist it here so pnpm 11's postinstall guard (which
# defaults to strictDepBuilds=true and ERR_PNPM_IGNORED_BUILDS on unknown
# packages) does not refuse every install. This replaces the v10
# `onlyBuiltDependencies: [esbuild]` field, which pnpm 11 has removed.
allowBuilds:
  esbuild: true
