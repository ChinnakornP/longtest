# Local development stack for the AI QA Agent platform.
#
# Stage-1 scope: state stores only (Postgres + MinIO). The Go backend, the web
# app and the QA daemon are run from source during development (`make dev-*`),
# because the daemon has to reach the target application on the developer's
# own network.
#
# Hardening notes:
#   * every published port binds to ${BIND_HOST} (127.0.0.1 by default) so the
#     database and the artifact store are never reachable from the LAN;
#   * no container gets extra privileges, host networking or the docker socket;
#   * the artifact bucket is created private — run evidence contains
#     screenshots and DOM dumps of the application under test.

name: ${COMPOSE_PROJECT_NAME:-qa}

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qa}
      POSTGRES_USER: ${POSTGRES_USER:-qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
      # Refuse to start with trust auth even if someone edits this file.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qa} -d ${POSTGRES_DB:-qa}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - copy .env.example to .env}
      # Do not advertise a browser-reachable console from the API port.
      MINIO_BROWSER_REDIRECT: "off"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot bucket bootstrap. Started by `make up` after the stores are
  # healthy; it exits 0 and is not part of the always-on stack.
  createbuckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?}:${MINIO_ROOT_PASSWORD:?}@minio:9000
      S3_BUCKET: ${S3_BUCKET:-qa-artifacts}
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        # Evidence is private: it contains screenshots and DOM of the
        # application under test. Access is only ever granted per-object
        # through short-lived presigned URLs.
        mc anonymous set none "local/$${S3_BUCKET}"
        mc version enable "local/$${S3_BUCKET}"
        echo "bucket ready: $${S3_BUCKET}"

volumes:
  postgres-data:
  minio-data:
